name: Feature request
description: Suggest a command, flag or workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The workflow, not the solution. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed command or flag
      render: shell
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to implement this myself
