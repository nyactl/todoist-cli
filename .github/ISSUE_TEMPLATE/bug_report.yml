name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its output. Remove task names you don't want public.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `todoist-cli --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and install method
      placeholder: macOS 15, Homebrew
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Did `todoist-cli sync` before the command change anything?
